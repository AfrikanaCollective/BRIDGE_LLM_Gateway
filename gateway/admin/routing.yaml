# Model -> ordered backend list, and backend -> base_url.
# See ARCHITECTURE.md §6.1/§6.5. Loaded once at startup by
# gateway.routing.registry.BackendRegistry.from_yaml — no hot-reload in v1.
#
# "priority: 0" is tried first; the gateway fails over to the next entry
# for a model (up to GATEWAY_MAX_FAILOVER_ATTEMPTS) if a backend is
# unhealthy, circuit-open, or errors before returning any output.
#
# These chains are heterogeneous: once a request exhausts the backends
# serving the requested model, it fails over to a DIFFERENT model (e.g.
# "qwen3.5:9b" falls over to qwen3.8:27b, then qwen3.6:35b). `model_name`
# on a routing entry is what makes that possible: it's the model actually
# requested from THAT backend, overriding the top-level "qwen3.5:9b" key
# (which is what tenants request and are rate-limited/budgeted against —
# see gateway/models/provider.py's target_model and
# ChatCompletionResponse.model in gateway/models/chat.py for how callers
# find out which model actually answered).
#
# Operational note: qwen3.5:9b, qwen3.8:27b and qwen3.6:35b differ in size
# — expect different latency and output characteristics on failover, not
# just "the same thing on a backup box." Keep `keep_alive` high on every
# backend; a cold secondary adds full model-load latency on top of being a
# different model (ARCHITECTURE.md §6.4).

backends:
  ollama-primary:
    base_url: http://172.17.0.1:11434
    enabled: true
    keep_alive: 5m
  ollama-secondary-1:
    base_url: http://172.16.13.67:11434
    enabled: true
    keep_alive: 5m
  ollama-secondary-2:
    base_url: http://172.16.13.68:11434
    enabled: true
    keep_alive: 5m

models:
  # Each model lives on exactly one backend:
  #   qwen3.5:9b  -> ollama-primary     (172.17.0.1)
  #   qwen3.8:27b -> ollama-secondary-1 (172.16.13.67)
  #   qwen3.6:35b -> ollama-secondary-2 (172.16.13.68)
  # Every chain tries the requested model first, then fails over to the
  # other two models on their own backends (via model_name).

  # Config A: qwen3.5:9b, failing over to qwen3.8:27b, then qwen3.6:35b.
  "qwen3.5:9b":
    - backend: ollama-primary
      priority: 0
      # no model_name override — this backend mirrors the requested model
    - backend: ollama-secondary-1
      model_name: "qwen3.8:27b"
      priority: 1
    - backend: ollama-secondary-2
      model_name: "qwen3.6:35b"
      priority: 2

  # Config B: qwen3.8:27b, failing over to qwen3.6:35b, then qwen3.5:9b.
  # The circuit breaker is keyed per (backend_id, model), so these
  # entries' health state is tracked independently of the same backends'
  # entries under configs A/C.
  #
  # A caller opts into this profile by requesting model="qwen3.8:27b"
  # in POST /v1/chat/completions. Requesting tenants need a rate_limit/
  # budget policy that covers "qwen3.8:27b" (see
  # gateway/admin/tenants.yaml); default-deny applies as for any model.
  "qwen3.8:27b":
    - backend: ollama-secondary-1
      priority: 0
      # no model_name override — this backend mirrors the requested model
    - backend: ollama-secondary-2
      model_name: "qwen3.6:35b"
      priority: 1
    - backend: ollama-primary
      model_name: "qwen3.5:9b"
      priority: 2

  # Config C: qwen3.6:35b, failing over to qwen3.8:27b, then qwen3.5:9b.
  #
  # A caller opts into this profile by requesting model="qwen3.6:35b".
  # Requesting tenants need a rate_limit/budget policy that covers
  # "qwen3.6:35b" (see gateway/admin/tenants.yaml).
  "qwen3.6:35b":
    - backend: ollama-secondary-2
      priority: 0
      # no model_name override — this backend mirrors the requested model
    - backend: ollama-secondary-1
      model_name: "qwen3.8:27b"
      priority: 1
    - backend: ollama-primary
      model_name: "qwen3.5:9b"
      priority: 2

# Same shape as `models:` above, but for embedding models — kept as a
# separate section (not another entry under `models:`) because a logical
# model is either a chat model or an embedding model, never both, and
# GatewayService routes/health-checks them differently (see
# gateway/routing/registry.py, gateway/providers/base.py EmbeddingProvider).
#
# EMPTY as of 2026-09-16: "qllama/bge-large-en-v1.5:latest" (the actual tag
# `ollama pull` resolves for BAAI/bge-large-en-v1.5) was removed here as an
# incident mitigation, not an architecture change. Its only backend,
# ollama-primary, has a wedged embedding runner on the Ollama side — chat
# on the same host recovered, but /api/embed never even attempts to spawn
# a runner (confirmed via `journalctl -u ollama`: no spawn log, no process,
# GPU idle) — while it stayed configured, requests hung for the full
# provider_request_timeout_seconds (600s) before failing instead of
# getting a fast, honest "no backend configured" error. With no second
# host serving this model, there's no failover entry to fall back to
# either (see git history for the last working single-backend config).
# Restore the entry once `sudo systemctl restart ollama` (or another fix)
# on that host clears the wedged runner — verify with a direct
# `POST /api/embed` against ollama-primary before adding it back.
embedding_models: {}
