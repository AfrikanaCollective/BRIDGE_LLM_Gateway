# Model -> ordered backend list, and backend -> base_url.
# See ARCHITECTURE.md §6.1/§6.5. Loaded once at startup by
# gateway.routing.registry.BackendRegistry.from_yaml — no hot-reload in v1.
#
# "priority: 0" is tried first; the gateway fails over to the next entry
# for a model (up to GATEWAY_MAX_FAILOVER_ATTEMPTS) if a backend is
# unhealthy, circuit-open, or errors before returning any output.
#
# This chain is heterogeneous by necessity, not by design choice: the three
# boxes below don't run the same model. A request for "qwen3.5:9b" that
# fails over past the primary is served by qwen3.6:35b or qwen3.8:27b-q4_K_M
# instead — a different model, on different hardware. `model_name` on a
# routing entry is what makes that possible: it's the model actually
# requested from THAT backend, overriding the top-level "qwen3.5:9b" key
# (which is what tenants request and are rate-limited/budgeted against —
# see gateway/models/provider.py's target_model and
# ChatCompletionResponse.model in gateway/models/chat.py for how callers
# find out which model actually answered).
#
# Operational note: qwen3.6:35b and qwen3.8:27b-q4_K_M are larger/different
# models than the primary — expect different latency and output
# characteristics on failover, not just "the same thing on a backup box."
# Keep `keep_alive` high on all three; a cold secondary adds full model-load
# latency on top of being a different model (ARCHITECTURE.md §6.4).

backends:
  ollama-primary:
    base_url: http://172.17.0.1:11434
    enabled: true
    keep_alive: 5m
  ollama-secondary-1:
    base_url: http://172.16.13.67:11434
    enabled: true
    keep_alive: 5m
  ollama-secondary-2:
    base_url: http://172.18.0.1:11434
    enabled: true
    keep_alive: 5m

models:
  # Config A: qwen3.5:9b (9B) as primary, failing over to the two larger
  # models. This is the default profile for callers with modest latency
  # needs that want the fastest model first.
  "qwen3.5:9b":
    - backend: ollama-primary
      priority: 0
      # no model_name override — this backend mirrors the requested model
    - backend: ollama-secondary-1
      model_name: "qwen3.6:35b"
      priority: 1
    - backend: ollama-secondary-2
      model_name: "qwen3.8:27b-q4_K_M"
      priority: 2

  # Config B: qwen3.6:35b (35B) as primary, failing over to qwen3.5:9b.
  # Same physical backends as config A above, reused under a second
  # top-level model key — the circuit breaker is keyed per
  # (backend_id, model), so ollama-primary/ollama-secondary-1's health
  # state here is tracked independently of their entries under
  # "qwen3.5:9b" and doesn't collide with them.
  #
  # A caller opts into this profile by requesting model="qwen3.6:35b"
  # instead of "qwen3.5:9b" in POST /v1/chat/completions — no separate
  # endpoint or config parameter. Requesting tenants need a rate_limit/
  # budget policy that covers "qwen3.6:35b" (see gateway/admin/tenants.yaml);
  # default-deny applies the same as any other model.
  "qwen3.6:35b":
    - backend: ollama-secondary-1
      priority: 0
      # no model_name override — this backend mirrors the requested model
    - backend: ollama-primary
      model_name: "qwen3.5:9b"
      priority: 1

# Same shape as `models:` above, but for embedding models — kept as a
# separate section (not another entry under `models:`) because a logical
# model is either a chat model or an embedding model, never both, and
# GatewayService routes/health-checks them differently (see
# gateway/routing/registry.py, gateway/providers/base.py EmbeddingProvider).
#
# Single-backend entry below because there's no known second host actually
# serving this model yet — add priority-1+ entries the same way the chat
# chain does above once a failover backend exists.
#
# "qllama/bge-large-en-v1.5:latest" is the actual tag `ollama pull` resolves
# for BAAI/bge-large-en-v1.5 (a community-contributed tag on Ollama's
# library, not BAAI's own — there is no official "bge-large-en-v1.5" tag).
# This is the exact string tenants must pass as `model` in
# POST /v1/embeddings; it's also what rate-limit/budget policies must be
# keyed on (gateway/admin/tenants.yaml) since policy lookup is an exact
# string match.
embedding_models:
  "qllama/bge-large-en-v1.5:latest":
    - backend: ollama-primary
      priority: 0
