# Seed data for tenants, API keys, and policies — read by
# gateway.admin.seed.seed_from_config() at startup/migration time.
# v1 has no self-serve CRUD API for this (PRD.md §10c); edit this file and
# re-run the seed script (`python -m gateway.admin.seed`) to add/change a
# tenant.
#
# `plaintext_key` here is ONLY used at seed time to compute key_hash; it is
# never persisted in plaintext and this file should not be committed with
# real production keys (use a secrets-managed copy in real deployments —
# this checked-in version is dev/example data only).
#
# There is no internal/implicit tenant — every caller of this gateway,
# including the separate web app that calls /generate-with-image (see
# ARCHITECTURE.md §9), authenticates as one of the tenants below.

tenants:
  - name: web-app
    # This is the tenant the external web app authenticates as when it
    # calls POST /generate-with-image (and/or /v1/*). Generate a real key
    # for production; give it to the web app as QWEN_SERVICE_API_KEY (or
    # whatever its config calls the Authorization bearer token) — it is
    # not read from this file at request time, only at seed time.
    #
    # The production key for this tenant has already been generated and
    # seeded (prefix "gw_live_" — see the running DB's api_keys table for
    # the prefix/hash; the plaintext is not recoverable from here). Do not
    # put the real plaintext key back in this file — re-running the seed
    # script with the placeholder below just creates an ADDITIONAL web-app
    # tenant with a NEW key, it does not touch or reveal the one already
    # seeded. The original dev placeholder key that was here before
    # (gw_dev_replace_me_web_app) has been explicitly revoked — do not put
    # it back either, since re-seeding it would silently create a fresh,
    # active (unrevoked) tenant using that already-shared value.
    plaintext_key: gw_live_replace_me_external
    rate_limit:
      model: "*"
      requests_per_minute: 60
      burst: 10
    budget:
      model: "*"
      period: monthly
      max_tokens: 2000000
      on_exceed: warn
    # The "*" wildcard above already covers "qllama/bge-large-en-v1.5:latest"
    # (or any other model added to routing.yaml) — no separate entry needed
    # for this tenant.

  - name: example-external-tenant
    # Scoped to specific models rather than "*", so rate_limit/budget are
    # lists here (one entry per model this tenant is entitled to) — see
    # gateway/admin/seed.py's _as_list(). A tenant with only one policy can
    # still use the plain-mapping shape (see web-app above); this tenant
    # needs three because it's entitled to all three routing.yaml chat
    # configs — config A ("qwen3.5:9b"), config B ("qwen3.8:27b-q4_K_M"),
    # and config C ("qwen3.6:35b", see routing.yaml) — with different
    # limits per model.
    plaintext_key: gw_dev_replace_me_external
    rate_limit:
      - model: "qwen3.5:9b"
        requests_per_minute: 30
        burst: 5
      - model: "qwen3.8:27b-q4_K_M"
        requests_per_minute: 20
        burst: 4
      - model: "qwen3.6:35b"
        requests_per_minute: 15
        burst: 3
    budget:
      - model: "qwen3.5:9b"
        period: daily
        max_requests: 10000
        on_exceed: block
      - model: "qwen3.8:27b-q4_K_M"
        period: daily
        max_requests: 7000
        on_exceed: block
      - model: "qwen3.6:35b"
        period: daily
        max_requests: 5000
        on_exceed: block
