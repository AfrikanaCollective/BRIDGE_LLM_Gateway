apiVersion: 1

providers:
  - name: gateway-dashboards
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      # Mounted separately from provisioning/ itself — see docker-compose.yml
      # grafana volumes (avoids the dashboards.yml file colliding with the
      # directory it points into).
      path: /var/lib/grafana/dashboards
